name: Echorouk Sunlight Build
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
      - run: flutter create . --project-name echorouk_sunlight
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r echorouk-sunlight.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: echorouk-sunlight-ipa
          path: build/ios/iphoneos/echorouk-sunlight.ipa

  build_android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
      - run: flutter create . --project-name echorouk_sunlight
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: echorouk-sunlight-apk
          path: build/app/outputs/flutter-apk/app-release.apk
