name: Faycal Midas Build
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
      - name: Create iOS platform folder
        run: flutter create --platforms=ios --org com.faycal --project-name faycal_midas .
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r faycal-midas.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: faycal-midas-ipa
          path: build/ios/iphoneos/faycal-midas.ipa

  build_android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
      - name: Create Android platform folder
        run: flutter create --platforms=android --org com.faycal --project-name faycal_midas .
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: faycal-midas-apk
          path: build/app/outputs/flutter-apk/app-release.apk
